<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="streak-render.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#streakRoot{width:350px;height:285px}
body:not(.streakLocked) #streakRoot{-webkit-app-region:drag;cursor:url("assets/move-cursor.png") 16 16,move}
body.streakLocked #streakRoot{-webkit-app-region:no-drag;cursor:default}
</style></head><body class="streakLocked"><div id="streakRoot" class="streak-widget"></div>
<script src="streak-render.js"></script><script>
let S=null;
function apply(s){if(!s)return;S=s;const locked=s.streak?.locked!==false;document.body.classList.toggle('streakLocked',locked);StreakRenderer.apply(streakRoot,s)}
api.onState(apply);api.onStreakLock?.(locked=>document.body.classList.toggle('streakLocked',!!locked));
(async()=>{const x=await api.get();apply(x.state)})();
</script></body></html>
