<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}iframe{position:absolute;border:0;background:transparent;overflow:hidden;transform-origin:0 0}#timer{left:0;top:0;width:1920px;height:1080px;transform:none!important;pointer-events:none}</style></head><body><iframe id="streak" src="/obs-streak"></iframe><iframe id="match" src="/obs-match"></iframe><iframe id="timer" src="http://127.0.0.1:17385/obs-timer"></iframe><script>
async function tick(){try{const S=await fetch('/state',{cache:'no-store'}).then(r=>r.json());const s=S.streak,m=S.match;streak.style.display=s.enabled?'block':'none';streak.style.left=(s.x||0)+'px';streak.style.top=(s.y||0)+'px';streak.style.width='400px';streak.style.height='230px';streak.style.transform=`scale(${Math.max(.6,Math.min(1.4,+s.scale||1))})`;const vertical=(+m.style||0)>=10;const setSize=Math.max(8,Math.min(16,+m.setTextSize||9));const titleSpace=m.showSetText===false?0:Math.max(24,setSize+14)+2;const mw=(vertical?320:640)+(m.killerImage?120:0);const mh=(vertical?360:200)+titleSpace;match.style.display=m.enabled?'block':'none';match.style.left=(m.x||0)+'px';match.style.top=(m.y||0)+'px';match.style.width=mw+'px';match.style.height=mh+'px';match.style.transform=`scale(${Math.max(.6,Math.min(1.3,+m.scale||1))})`}catch{}}
setInterval(tick,150);tick();
</script></body></html>
