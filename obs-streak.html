<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:230px;overflow:hidden;background:transparent}#streakRoot{width:100%;height:230px}
</style><link rel="stylesheet" href="/streak-render.css"></head><body><div id="streakRoot" class="streak-widget"></div>
<script src="/streak-render.js"></script><script>
let last='';
async function draw(){try{const S=await fetch('/state',{cache:'no-store'}).then(r=>r.json());const key=JSON.stringify(S.streak);if(key!==last){last=key;StreakRenderer.apply(streakRoot,S)}}catch{}}
setInterval(draw,250);draw();
</script></body></html>
